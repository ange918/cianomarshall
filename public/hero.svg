<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ambiance éditoriale AFA">
  <defs>
    <radialGradient id="spot" cx="62%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#2a2620" />
      <stop offset="42%" stop-color="#161412" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#d4af37" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d67b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f5d67b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#spot)" />

  <!-- Faisceau de lumière directionnel -->
  <polygon points="1180,-100 1520,-100 1080,1180 640,1180" fill="url(#beam)" />
  <polygon points="700,-100 840,-100 460,1180 260,1180" fill="url(#beam)" opacity="0.5" />

  <!-- Halo doux -->
  <ellipse cx="1180" cy="380" rx="520" ry="460" fill="url(#glow)" opacity="0.5" />

  <!-- Colonnes / architecture minimale suggérée -->
  <g fill="#000000" opacity="0.35">
    <rect x="150" y="120" width="90" height="840" />
    <rect x="1680" y="80" width="120" height="920" />
  </g>
  <g fill="#ffffff" opacity="0.03">
    <rect x="150" y="120" width="18" height="840" />
    <rect x="1680" y="80" width="24" height="920" />
  </g>

  <!-- Étoile AFA en filigrane -->
  <g transform="translate(1180 430)" fill="#d4af37" opacity="0.12">
    <path d="M0 -150 L34 -46 L142 -44 L54 22 L86 132 L0 68 L-86 132 L-54 22 L-142 -44 L-34 -46 Z" />
  </g>

  <rect width="1920" height="1080" fill="url(#floor)" />
</svg>
