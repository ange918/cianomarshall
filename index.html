<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2></h2>
            </div>

            <ul class="nav-menu" id="nav-menu">
                <li class="nav-item">
                    <a href="#home" class="nav-link"></a>
                </li>
                <li class="nav-item">
                    <a href="#about" class="nav-link"></a>
                </li>
                <li class="nav-item">
                    <a href="#playlist" class="nav-link"></a>
                </li>
                <li class="nav-item">
                    <a href="#testimonials" class="nav-link"></a>
                </li>
                <li class="nav-item">
                    <a href="#contact" class="nav-link"></a>
                </li>
            </ul>

            <div class="nav-icons">
                <button class="cart-btn" id="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
                <div class="hamburger" id="hamburger">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-container">
            <div class="hero-image">
                <div class="hero-image-placeholder">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="hero-image-overlay"></div>
            </div>
            <div class="hero-content">
                <div class="hero-badge"></div>
                <h1 class="hero-title"></h1>
                <p class="hero-subtitle"></p>
                <p class="hero-description"></p>
                <div class="hero-buttons">
                    <button class="hero-btn primary" id="discover-btn">
                        <span></span>
                        <i class="fas fa-arrow-down"></i>
                    </button>
                    <button class="hero-btn secondary" id="play-demo">
                        <i class="fas fa-play"></i>
                        <span></span>
                    </button>
                </div>
                <div class="hero-stats">
                    <div class="stat-item">
                        <span class="stat-number"></span>
                        <span class="stat-label"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number"></span>
                        <span class="stat-label"></span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number"></span>
                        <span class="stat-label"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="about">
        <div class="container">
            <div class="about-content">
                <div class="about-text">
                    <h2 class="section-title"></h2>
                    <p class="about-description"></p>
                    <p class="about-description"></p>
                    <div class="about-stats">
                        <div class="stat">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div class="stat">
                            <h3></h3>
                            <p></p>
                        </div>
                        <div class="stat">
                            <h3></h3>
                            <p></p>
                        </div>
                    </div>
                    <button class="about-btn" id="beats-btn"></button>
                </div>
                <div class="about-visual">
                    <div class="about-image">
                        <div class="about-placeholder">
                            <i class="fas fa-music"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Playlist/Shop Section -->
    <section id="playlist" class="playlist">
        <div class="container">
            <div class="playlist-header">
                <h2 class="section-title"></h2>
                <div class="playlist-controls">
                    <button class="play-all-btn">
                        <i class="fas fa-play"></i>
                    </button>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="list">
                            <i class="fas fa-list"></i>
                        </button>
                        <button class="view-btn" data-view="grid">
                            <i class="fas fa-th-large"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="playlist-container">
                <div class="playlist-sidebar">
                    <div class="playlist-info">
                        <div class="playlist-cover">
                            <i class="fas fa-music"></i>
                        </div>
                        <h3></h3>
                        <p></p>
                        <div class="playlist-meta">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    <div class="genre-filters">
                        <h4></h4>
                        <button class="filter-btn active" data-genre="all"></button>
                    </div>
                </div>

                <div class="playlist-content">
                    <div class="playlist-table-header">
                        <div class="col-number"></div>
                        <div class="col-title"></div>
                        <div class="col-genre"></div>
                        <div class="col-duration"></div>
                        <div class="col-price"></div>
                        <div class="col-actions"></div>
                    </div>
                    <div class="beats-list" id="beats-list">
                        <!-- Items will be dynamically generated -->
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Testimonials Section -->
    <section id="testimonials" class="testimonials">
        <div class="container">
            <h2 class="section-title"></h2>
            <div class="testimonials-slider" id="testimonials-slider">
                <div class="testimonial active">
                    <div class="testimonial-content">
                        <p></p>
                        <div class="testimonial-author">
                            <h4></h4>
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <div class="container">
            <h2 class="section-title"></h2>
            <p class="section-subtitle"></p>

            <div class="contact-content">
                <div class="contact-info">
                    <div class="contact-item">
                        <i class="fas fa-envelope"></i>
                        <div>
                            <h4></h4>
                            <p></p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-phone"></i>
                        <div>
                            <h4></h4>
                            <p></p>
                        </div>
                    </div>
                    <div class="contact-item">
                        <i class="fas fa-map-marker-alt"></i>
                        <div>
                            <h4></h4>
                            <p></p>
                        </div>
                    </div>
                </div>

                <form class="contact-form" id="contact-form">
                    <div class="form-group">
                        <input type="text" id="name" name="name" placeholder="" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="" required>
                    </div>
                    <div class="form-group">
                        <textarea id="message" name="message" placeholder="" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn"></button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3></h3>
                    <p></p>
                </div>

                <div class="footer-section">
                    <h4></h4>
                    <ul>
                        <li><a href="#home"></a></li>
                        <li><a href="#about"></a></li>
                        <li><a href="#playlist"></a></li>
                        <li><a href="#contact"></a></li>
                    </ul>
                </div>

                <div class="footer-section">
                    <h4></h4>
                    <div class="social-links">
                        <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="social-link"><i class="fab fa-youtube"></i></a>
                        <a href="#" class="social-link"><i class="fab fa-tiktok"></i></a>
                        <a href="#" class="social-link"><i class="fab fa-spotify"></i></a>
                    </div>
                </div>
            </div>

            <div class="footer-bottom">
                <p></p>
            </div>
        </div>
    </footer>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3></h3>
            <button class="close-cart" id="close-cart">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Cart items will be dynamically added -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <h4><span id="cart-total">0€</span></h4>
            </div>
            <button class="checkout-btn" id="checkout-btn"></button>
        </div>
    </div>

    <!-- Cart Overlay -->
    <div class="cart-overlay" id="cart-overlay"></div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
